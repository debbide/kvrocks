name: Build and Push Kvrocks Docker to Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # 使用最新的 Ubuntu 运行环境

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies  # 安装构建 Kvrocks 镜像所需的依赖
      run: |
        sudo apt update
        sudo apt install -y git build-essential cmake libtool python3 libssl-dev

    - name: Set up QEMU (multi-arch)  # 设置 QEMU 来支持多平台
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx  # 设置 Docker Buildx 来构建多平台镜像
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}  # 从 GitHub Secrets 获取 Docker Hub 用户名
        password: ${{ secrets.DOCKERHUB_TOKEN }}    # 从 GitHub Secrets 获取 Docker Hub Token

    - name: Build and push multi-platform Docker image
      uses: docker/build-push-action@v5
      with:
        context: .  # 构建上下文为当前目录
        platforms: linux/amd64,linux/arm64  # 支持 amd64 和 arm64 架构
        push: true  # 推送到 Docker Hub
        tags: |
          cakeor/kvrocks:latest  # 使用最新标签
          cakeor/kvrocks:${{ github.sha }}  # 使用 commit SHA 作为标签
        build-args: |
          ENABLE_OPENSSL=ON  # 启用 OpenSSL
